<!doctype html>
<html><head><meta charset="utf-8"><title>Card SVG previews</title>
<style>
body { background: oklch(0.96 0.012 305); margin: 0; padding: 60px 40px; font-family: system-ui, sans-serif; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 50px; max-width: 900px; margin: 0 auto; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.cell img { width: 200px; height: auto; }
.cell span { font-size: 12px; color: #5a4a6a; letter-spacing: 0.06em; }
</style></head>
<body>
<div class="grid">
  <div class="cell"><img src="card-1-forecast-1-5-months.svg"><span>I · Forecast 1–5</span></div>
  <div class="cell"><img src="card-2-forecast-year.svg"><span>II · Forecast Year</span></div>
  <div class="cell"><img src="card-3-situation-analysis.svg"><span>III · Situation</span></div>
  <div class="cell"><img src="card-4-choice.svg"><span>IV · Choice</span></div>
  <div class="cell"><img src="card-5-relationships.svg"><span>V · Relationships</span></div>
  <div class="cell"><img src="card-6-career.svg"><span>VI · Career</span></div>
</div>
</body></html>
